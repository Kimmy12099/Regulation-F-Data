<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pokémon Regulation F Data</title>
<style>
  body { font-family: "Times New Roman", serif; background:#0f172a; color:#f1f5f9; padding:20px; }
  .card { background:#1e293b; border-radius:12px; padding:15px; margin-bottom:20px; box-shadow:0 4px 8px rgba(0,0,0,0.3); position:relative; }
  .sprite { width:80px; height:80px; position:absolute; top:15px; right:15px; }
  h2 {
    margin:0 0 5px;
    font-size:2rem;
    color:#f1f5f9;
  }
  .section { display:flex; gap:20px; margin-top:10px; }
  .col { flex:1; }
  .label {
    font-weight: bold;
    margin-bottom:5px;
    font-size:0.85rem;
    color: #facc15;
    text-shadow: 1px 1px 2px black;
  }
  ul { margin:0; padding-left:20px; font-size:0.85rem; }
  .footer { margin-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:1rem; }
  .resource { color:#facc15; text-decoration:underline; }
  .stats { font-size:0.8rem; margin-top:5px; }
  .stats span { display:inline-block; margin-right:10px; }
  .date { font-size:0.8rem; color:#94a3b8; margin-bottom:10px; }
</style>
</head>
<body>

<div id="cards"></div>

<template id="card-tpl">
  <div class="card">
    <h2 data-field="pokemon">—</h2>
    <img data-field="sprite" class="sprite" src="" alt="Pokemon sprite">

    <div data-field="date" class="date">—</div>

    <div class="section">
      <!-- Left column: all moves -->
      <div class="col">
        <div class="label">Common moves (&gt;25%)</div>
        <ul data-field="common-moves"></ul>

        <div class="label" style="margin-top:8px">Not common (&lt;25%)</div>
        <ul data-field="not-common-moves"></ul>

        <div class="label" style="margin-top:8px">Rarely carry</div>
        <ul data-field="rare-moves"></ul>
      </div>

      <!-- Right column: items, teammates, base stats -->
      <div class="col">
        <div class="label">Items (&gt;10%)</div>
        <div data-field="common-items"></div>

        <div class="label" style="margin-top:8px">Items (&lt;10%)</div>
        <div data-field="uncommon-items"></div>

        <div class="label" style="margin-top:8px">Common Teammates</div>
        <div data-field="common-teammates"></div>

        <div class="label" style="margin-top:8px">Base Stats</div>
        <div data-field="base-stats" class="stats"></div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div>EV trained: <span data-field="ev">—</span></div>
        <div>Nature: <span data-field="nature">—</span></div>
        <div>Most common speed: <span data-field="speed-text">—</span></div>
      </div>
      <a class="resource" data-field="resource" href="#">Resource</a>
    </div>
  </div>
</template>

<script>
const container = document.getElementById('cards');
const tpl = document.getElementById('card-tpl');

function renderCard(data){
  const node = tpl.content.cloneNode(true);

  node.querySelector('[data-field=pokemon]').textContent = data.pokemon;
  node.querySelector('[data-field=sprite]').src = data.sprite || '';
  node.querySelector('[data-field=sprite]').alt = data.pokemon || 'Pokemon sprite';
  node.querySelector('[data-field=date]').textContent = data.date || '—';
  node.querySelector('[data-field=ev]').textContent = data.ev || '—';
  node.querySelector('[data-field=nature]').textContent = data.nature || '—';
  node.querySelector('[data-field=speed-text]').textContent = data.speedText || '—';

  // Moves
  const cm = node.querySelector('[data-field=common-moves]');
  (data.commonMoves || []).forEach(m => { const li = document.createElement('li'); li.textContent = m; cm.appendChild(li); });

  const ncm = node.querySelector('[data-field=not-common-moves]');
  (data.notCommonMoves || []).forEach(m => { const li = document.createElement('li'); li.textContent = m; ncm.appendChild(li); });

  const rm = node.querySelector('[data-field=rare-moves]');
  (data.rareMoves || []).forEach(m => { const li = document.createElement('li'); li.textContent = m; rm.appendChild(li); });

  // Items
  node.querySelector('[data-field=common-items]').innerHTML = (data.commonItems || []).join(', ');
  node.querySelector('[data-field=uncommon-items]').innerHTML = (data.uncommonItems || []).join(', ');

  // Common Teammates
  node.querySelector('[data-field=common-teammates]').innerHTML = (data.commonTeammates || []).join(', ');

  // Base Stats
  const statsDiv = node.querySelector('[data-field=base-stats]');
  if(data.baseStats){
    statsDiv.innerHTML = `
      <span>HP: ${data.baseStats.hp}</span>
      <span>Atk: ${data.baseStats.atk}</span>
      <span>Def: ${data.baseStats.def}</span>
      <span>SpA: ${data.baseStats.spa}</span>
      <span>SpD: ${data.baseStats.spd}</span>
      <span>Spe: ${data.baseStats.spe}</span>
    `;
  }

  // Resource link
  const res = node.querySelector('[data-field=resource]');
  res.setAttribute('href', data.resource || '#');
  res.textContent = 'Source';

  container.appendChild(node);
}

// Fetch JSON and render cards
fetch('pokemonData.json')
  .then(res => res.json())
  .then(data => data.forEach(renderCard))
  .catch(err => console.error('Error loading JSON:', err));
</script>

</body>
</html>
